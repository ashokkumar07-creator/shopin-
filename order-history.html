
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>My Order History | Priya Kambu Kool</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff8f3;
      color: #30241d;
      font-family: Arial, sans-serif;
    }

    header {
      background: white;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 12px #0001;
    }

    header h2 {
      color: #e65c00;
      margin: 0;
      font-size: 20px;
    }

    .back {
      color: #e65c00;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 850px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .heading {
      margin-bottom: 25px;
    }

    .heading h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .heading p {
      color: #777;
    }

    .order-card {
      background: white;
      border: 1px solid #f1dfd1;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px #00000008;
    }

    .order-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .order-id {
      font-weight: bold;
      font-size: 18px;
    }

    .status {
      background: #e6f7e9;
      color: #167a36;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .date {
      color: #777;
      font-size: 13px;
      margin: 10px 0 18px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .details {
      margin-top: 15px;
      color: #555;
      font-size: 14px;
    }

    .details p {
      margin: 8px 0;
    }

    .total {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-weight: bold;
      font-size: 19px;
      color: #e65c00;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 55px 20px;
      border-radius: 16px;
      color: #777;
    }

    .empty h2 {
      color: #30241d;
    }

    @media (max-width: 600px) {
      header h2 { font-size: 16px; }
      .heading h1 { font-size: 24px; }
      .order-card { padding: 16px; }
    }
  </style>
</head>

<body>

<header>
  <h2>Priya Kambu Kool</h2>
  <a href="index.html" class="back">← Back to Shop</a>
</header>

<main>
  <div class="heading">
    <h1>My Order History</h1>
    <p id="customerInfo">Loading your orders...</p>
  </div>

  <div id="ordersContainer"></div>
</main>

<script>
  const container =
    document.getElementById("ordersContainer");

  const customerInfo =
    document.getElementById("customerInfo");

  function escapeHTML(value) {
    const el = document.createElement("span");
    el.textContent = String(value ?? "");
    return el.innerHTML;
  }

  function readJSON(key, fallback) {
    try {
      return JSON.parse(localStorage.getItem(key)) ?? fallback;
    } catch {
      return fallback;
    }
  }

  function formatMoney(value) {
    return "₹" + Number(value || 0)
      .toLocaleString("en-IN");
  }

  function renderOrders() {
    const customer =
      readJSON("pkk_customer_v1", null);

    if (!customer) {
      customerInfo.textContent = "Please sign in first.";
      container.innerHTML = `
        <div class="empty">
          <h2>Sign In Required</h2>
          <p>Sign in to view orders saved on this device.</p>
          <a class="back" href="index.html#customer">
            Go to Customer Login
          </a>
        </div>
      `;
      return;
    }

    customerInfo.textContent =
      "Welcome, " + customer.name;

    const allOrders =
      readJSON("pkk_orders_v1", []);

    const phone = String(customer.phone || "")
      .replace(/\D/g, "").slice(-10);

    const orders = (Array.isArray(allOrders) ? allOrders : [])
      .filter(order =>
        String(order.customer?.phone || "")
          .replace(/\D/g, "").slice(-10) === phone
      )
      .sort((a, b) =>
        new Date(b.createdAt) - new Date(a.createdAt)
      );

    if (!orders.length) {
      container.innerHTML = `
        <div class="empty">
          <h2>No Orders Yet</h2>
          <p>Your previous orders on this device
             will appear here.</p>
          <a href="index.html#main-dish" class="back">
            Explore Menu
          </a>
        </div>
      `;
      return;
    }

    container.innerHTML = orders.map(order => {
      const items = Array.isArray(order.items)
        ? order.items : [];

      const status = order.status === "Success"
        ? "Success"
        : order.billPrepared
          ? "Bill Prepared"
          : (order.status || "New");

      const date = new Date(order.createdAt);
      const dateText = Number.isNaN(date.getTime())
        ? "Date unavailable"
        : date.toLocaleString("en-IN");

      const itemHTML = items.map(item => `
        <div class="item">
          <span>
            ${escapeHTML(item.name)}
            × ${Number(item.qty) || 0}
          </span>
          <strong>
            ${formatMoney(
              Number(item.price || 0) *
              Number(item.qty || 0)
            )}
          </strong>
        </div>
      `).join("");

      return `
        <article class="order-card">
          <div class="order-head">
            <span class="order-id">
              Order #${escapeHTML(order.id)}
            </span>
            <span class="status">
              ${escapeHTML(status)}
            </span>
          </div>

          <p class="date">${escapeHTML(dateText)}</p>

          ${itemHTML}

          <div class="details">
            <p>
              Order Type:
              ${order.fulfillment === "takeaway"
                ? "Takeaway" : "Dine in / on table"}
            </p>
            <p>
              Payment:
              ${escapeHTML(order.payment || "Not specified")}
            </p>
          </div>

          <div class="total">
            <span>Grand Total</span>
            <span>
              ${formatMoney(
                order.finalTotal ?? order.total
              )}
            </span>
          </div>
        </article>
      `;
    }).join("");
  }

  renderOrders();
</script>

</body>
</html>
